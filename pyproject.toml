[project]
name = "cinema-city"
version = "10.5.3"
description = "Cinema-Booking project with production style structure, Provider-independent, plus CLI, Web, local JSON, and Neon-DB built-in adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "filelock>=3.16,<5",
    "httpx>=0.28.1",
    "platformdirs>=4,<5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
cinema-manager = "cinema.cli.manager_cli:main"
cinema-customer = "cinema.cli.customer_cli:main"
cinema-web = "cinema.web.app:main"
cinema-customer-web = "cinema.web.app:customer_main"
cinema-manager-web = "cinema.web.app:manager_main"
cinema-db-seed = "cinema.db_seed:main"

[dependency-groups]
commit = [
    "pre-commit>=4.6.2",
]
dev = [
    "bandit[toml]>=1.9.4",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
    "vulture>=2.16",
]

[tool.uv]
package = true
exclude-newer = "1 week"

[tool.uv.audit]
malware-check = true

[tool.setuptools.package-data]
cinema = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=cinema --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "C4", "UP", "S", "ARG", "PTH", "SIM", ]
ignore = ["E501", ]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "ARG001", ]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]
fail-under = 9.0
persistent = false

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "arguments-renamed",
    "missing-class-docstring",
    "missing-function-docstring",
    "protected-access",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
    "try-except-raise",
    "line-too-long",
    "wrong-import-order",
    "ungrouped-imports",
]

[tool.pylint.similarities]
min-similarity-lines = 12

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = ["B101", "B104"]    # Skips assert warnings, and bind to 0.0.0.0
sev_level = "MEDIUM"        # Or "LOW" if you want to track smaller issues 
