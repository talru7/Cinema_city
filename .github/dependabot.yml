version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-updates:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"         # daily / weekly / monthly
    cooldown:
        default-days: 7
    groups:                      # define Pull-Requests unite groups
      security-updates:
        patterns:
          - "*"
      version-updates:
        patterns:
          - "*"
